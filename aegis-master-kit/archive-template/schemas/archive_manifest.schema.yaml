schema_id: archive_manifest.schema.v1
kind: aegis_schema
purpose: Repo-visible manifest for a project Archive instance.
required:
  - archive_id
  - project_id
  - archive_version
  - created_at
  - created_by
  - storage_mode
  - authority
  - security
fields:
  archive_id:
    type: string
    immutable: true
  project_id:
    type: string
    immutable: true
  project_name:
    type: string
  archive_version:
    type: string
    example: v1
  created_at:
    type: datetime
  created_by:
    type: string
    expected: master id
  storage_mode:
    type: enum
    values: [encrypted_payload]
  status:
    type: enum
    values: [bootstrap_pending, sealed, compromised, recovery_required]
  authority:
    required: [owner_role, developer_direct_mutation_allowed, ordinary_agent_execution_dependency]
    fields:
      owner_role:
        type: enum
        values: [master]
      developer_direct_mutation_allowed:
        type: boolean
        expected: false
      ordinary_agent_execution_dependency:
        type: boolean
        expected: false
  security:
    required:
      - plaintext_in_repo_allowed
      - encrypted_at_rest_required
      - master_private_security_required
      - private_material_disclosure_allowed
    fields:
      plaintext_in_repo_allowed:
        type: boolean
        expected: false
      encrypted_at_rest_required:
        type: boolean
        expected: true
      master_private_security_required:
        type: boolean
        expected: true
      private_material_disclosure_allowed:
        type: boolean
        expected: false
  paths:
    fields:
      encrypted_payload:
        type: path
      public_manifest:
        type: path
      integrity_dir:
        type: path
      public_indexes_dir:
        type: path
