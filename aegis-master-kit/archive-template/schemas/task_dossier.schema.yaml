schema_id: task_dossier.schema.v1
kind: aegis_schema
purpose: Master-side plaintext task dossier schema. Must not be committed as plaintext in project repo.
required:
  - task_id
  - title
  - status
  - task_source
  - lifecycle
  - responsibility
  - scope
  - success_criteria
  - artifact_refs
  - outcome
  - terminal_completion_gate
fields:
  task_id:
    type: string
    immutable: true
    pattern: '^T[0-9]{8}-[0-9]{3}-[a-z0-9-]+$'
  title:
    type: string
  status:
    type: enum
    values: [created, admitted, in_progress, blocked, reviewing, verifying, completed, aborted, superseded, reopened]
  task_source:
    schema_ref: task_source.schema.v1
  lifecycle:
    required: [created_at]
    fields:
      created_at: {type: datetime}
      admitted_at: {type: datetime_or_null}
      started_at: {type: datetime_or_null}
      blocked_at: {type: datetime_or_null}
      completed_at: {type: datetime_or_null}
      aborted_at: {type: datetime_or_null}
      superseded_at: {type: datetime_or_null}
      reopened_at: {type: datetime_or_null}
  responsibility:
    required: [developer_owner, master_owner]
    fields:
      developer_owner: {type: string}
      master_owner: {type: string}
      final_human_approver: {type: string_or_null}
      ai_participants:
        type: list
        item_fields:
          role: {type: string}
          id: {type: string}
          contribution: {type: string}
  scope:
    required: [goal, in_scope, out_of_scope]
    fields:
      goal: {type: string}
      in_scope: {type: list_of_string}
      out_of_scope: {type: list_of_string}
  success_criteria:
    type: list_of_string
  timeline_refs:
    type: list_of_string
  decision_refs:
    type: list_of_string
  artifact_refs:
    type: list
    item_schema_ref: artifact_manifest.schema.v1
  terminal_completion_gate:
    purpose: Required gate for terminal status completed. If status is not completed, values may be null or empty.
    required:
      - final_decision_ref
      - required_stage_artifact_refs
      - waiver_amendment_refs
      - postmortem_ref
    fields:
      final_decision_ref:
        type: string_or_null
        required_when_status: completed
      required_stage_artifact_refs:
        type: list_of_string
        required_when_status: completed
        description: References to required terminal stage artifacts, or empty only when waiver_amendment_refs covers the missing artifacts.
      waiver_amendment_refs:
        type: list_of_string
        description: Explicit amendment refs that waive missing terminal stage artifacts or postmortem.
      postmortem_ref:
        type: string_or_null
        required_when_status: completed
  outcome:
    required: [result]
    fields:
      result:
        type: enum_or_null
        values: [completed, aborted, superseded, rejected, null]
      final_solution: {type: string_or_null}
      changed_files: {type: list_of_string}
      verification_summary: {type: string_or_null}
      known_limits: {type: list_of_string}
      followups: {type: list_of_string}
      promoted_to_knowledge: {type: list_of_string}
      promoted_to_causal: {type: list_of_string}
conditional_rules:
  - when: "status == completed"
    require:
      - lifecycle.completed_at
      - terminal_completion_gate.final_decision_ref
      - terminal_completion_gate.postmortem_ref
      - outcome.result
      - outcome.final_solution
      - outcome.verification_summary
      - outcome.known_limits
    rule: Completed state is invalid unless all required terminal records exist.
  - when: "status == completed and terminal_completion_gate.required_stage_artifact_refs is empty"
    require:
      - terminal_completion_gate.waiver_amendment_refs
    rule: Missing required stage artifact references require explicit waiver amendment refs.
  - when: "status == completed and terminal_completion_gate.postmortem_ref is null"
    require:
      - terminal_completion_gate.waiver_amendment_refs
    rule: Missing postmortem requires explicit waiver amendment refs.
