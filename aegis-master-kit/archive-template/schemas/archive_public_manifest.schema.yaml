schema_id: archive_public_manifest.schema.v1
kind: aegis_schema
purpose: Non-sensitive public metadata for an encrypted Archive.
required:
  - project_id
  - archive_id
  - payload_version
  - public_root_token
  - latest_seal_ref
fields:
  project_id:
    type: string
  archive_id:
    type: string
  payload_version:
    type: integer
  public_root_token:
    type: string
    description: Opaque Master-generated root token. Implementation details are not repo-visible.
  latest_seal_ref:
    type: string_or_null
  public_index_policy:
    type: enum
    values: [minimal_non_sensitive]
  public_task_count:
    type: integer
    nullable: true
  status_summary:
    type: map
    nullable: true
forbidden:
  - plaintext task details
  - private security material
  - reproducible verification internals
