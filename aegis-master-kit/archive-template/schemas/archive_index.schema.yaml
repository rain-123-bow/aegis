schema_id: archive_index.schema.v1
kind: aegis_schema
purpose: Minimal public generated index schema.
required:
  - index_type
  - generated_at
  - generated_by
  - sensitivity
  - entries
fields:
  index_type:
    type: enum
    values: [by_status, by_owner, by_source, by_date, by_module]
  generated_at:
    type: datetime
  generated_by:
    type: string
  sensitivity:
    type: enum
    values: [minimal_non_sensitive]
  payload_version:
    type: integer
  public_root_token:
    type: string
  entries:
    type: map
    description: Minimal non-sensitive index entries.
