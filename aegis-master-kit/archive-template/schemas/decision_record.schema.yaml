schema_id: decision_record.schema.v1
kind: aegis_schema
purpose: Key decision record inside a task dossier.
required:
  - decision_id
  - decided_at
  - decided_by
  - decision
  - statement
  - rationale
fields:
  decision_id:
    type: string
    example: D001
  decided_at:
    type: datetime
  decided_by:
    type: string
  decision:
    type: enum
    values: [accepted, rejected, deferred, superseded, needs_more_evidence]
  statement:
    type: string
  rationale:
    type: string
  alternatives:
    type: list_of_string
  evidence_refs:
    type: list_of_string
  impact:
    type: string
  supersedes:
    type: list_of_string
