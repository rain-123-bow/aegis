schema_name: causal_public_manifest
version: v1
required:
  - project_id
  - store_type
  - causal_version_public_label
  - encrypted_payload_ref
  - latest_public_root_ref
fields:
  project_id: string
  store_type:
    enum: [causal]
  causal_version_public_label: string
  encrypted_payload_ref: string
  latest_public_root_ref: string
  public_index_ref: string
  last_public_update: datetime
  state:
    enum: [bootstrap_pending, sealed, integrity_unknown, recovery_required]
