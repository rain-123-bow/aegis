schema_name: causal_relation
version: v1
required:
  - source_claim
  - relation_type
  - target_claim
fields:
  source_claim: string
  relation_type:
    enum: [depends_on, invalidates, supersedes, challenges, narrows_scope_of, broadens_scope_of]
  target_claim: string
  reason: string
  created_by: string
  created_at: datetime
  status:
    enum: [active, invalidated, superseded]
