schema_name: causal_merge_record
version: v1
required:
  - merge_id
  - from_branch
  - to_branch
  - base_causal_version
  - new_causal_version
  - review_refs
  - sealed_at
  - sealed_by
fields:
  merge_id: string
  from_branch: string
  to_branch: string
  base_causal_version: string
  new_causal_version: string
  review_refs: list
  accepted_claims: list
  accepted_tentative_claims: list
  rejected_proposals: list
  status_transitions: list
  route_plan_updates: list
  sealed_at: datetime
  sealed_by: string
