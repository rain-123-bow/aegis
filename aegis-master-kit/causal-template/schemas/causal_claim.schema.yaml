schema_name: causal_claim
version: v1
required:
  - id
  - claim
  - why
  - scope
  - version_context
  - valid_when
  - assumptions
  - evidence_refs
  - proof_mode
  - confidence
  - status
  - admitted_by
  - admitted_at
fields:
  id: string
  claim:
    type: string
    description: Inferred judgment only. Direct facts are invalid as Causal claims and should be routed to Knowledge when appropriate.
  why:
    type: string
    description: Minimal supporting cause for the inferred judgment; not full chain-of-thought.
  type:
    enum: [causal_claim]
  scope:
    type: object
  version_context:
    type: object
  valid_when:
    type: object
  assumptions:
    type: list
  uses_knowledge:
    type: list
  uses_causal:
    type: list
  uses_archive:
    type: list
  evidence_refs:
    type: list
  proof_mode:
    enum:
      - first_principles
      - contract_deduction
      - code_inspection
      - reproducible_test
      - statistical_evidence
      - observation_only
      - expert_report
  confidence:
    enum: [high, medium, low]
  relations:
    fields:
      depends_on: list
      invalidates: list
      supersedes: list
      challenged_by: list
  route_defaults:
    description: Optional non-binding hints; actual route/expand lives in route_plan.
  status:
    enum: [active, tentative, conflicted, invalidated, superseded, deprecated, rejected]
  admitted_by: string
  admitted_at: datetime
  updated_at: datetime
  status_transition_refs: list
