schema_name: causal_conflict_record
version: v1
required:
  - conflict_id
  - detected_between
  - conflict_scope
  - status
fields:
  conflict_id: string
  detected_between: list
  conflict_scope: object
  reason: string
  detected_by: string
  detected_at: datetime
  status:
    enum: [open, resolved, rejected_as_not_conflict]
  resolution:
    enum: [reject, split_scope, update_assumptions, invalidate_old, supersede_old, request_more_evidence, mark_branch_stale, correct_knowledge, none]
  resolution_record: string
