schema_name: route_plan
version: v1
required:
  - route_plan_id
  - query_id
  - based_on_causal_version
  - generated_by
  - selected_claims
fields:
  route_plan_id: string
  query_id: string
  based_on_causal_version: string
  generated_by: string
  generated_at: datetime
  selected_claims:
    type: list
    item_fields:
      claim_id: string
      route_grade:
        enum: [A, B, C, D, E, F]
      expand_grade:
        enum: [A, B, C, D]
      reasoning_status:
        enum: [candidate, selected_for_main_reasoning, background_only, expanded, used_in_answer, blocked_by_conflict, excluded_this_round, stale]
      reason: string
      include_fields: list
  excluded_claims: list
  seal_ref: string
