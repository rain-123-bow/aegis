schema: knowledge_proposal.schema.yaml
version: v1
required:
  - proposal_id
  - proposed_action
  - proposer
  - submitted_at
  - reason_for_submission
  - sources
  - scope
  - version_context
fields:
  proposal_id:
    type: string
    pattern: '^P[0-9]{8}-[0-9]{3}-[a-z0-9-]+$'
  proposed_action:
    enum:
      - add_entry
      - update_metadata
      - mark_tentative
      - promote_to_active
      - deprecate_entry
      - invalidate_entry
      - supersede_entry
      - mark_conflicted
      - resolve_conflict
  target_entry_id:
    type: string
  proposed_statement:
    type: string
  proposer:
    type: object
    required: [role, id]
  submitted_at:
    type: datetime
  reason_for_submission:
    type: string
  expected_impact:
    type: string
  sources:
    type: list
    min_items: 1
  scope:
    type: object
  version_context:
    type: object
  applicability_conditions:
    type: list
  master_review:
    type: object
    fields:
      result:
        enum: [accepted, accepted_as_tentative, rejected, needs_more_evidence, conflicted, out_of_scope]
      reviewed_by:
        type: string
      reviewed_at:
        type: datetime
      rationale:
        type: string
