schema: knowledge_public_manifest.schema.yaml
version: v1
required:
  - knowledge_base_id
  - project_id
  - repo_visible_state
  - security_class
  - plaintext_present
  - latest_public_root_ref
  - latest_session_seal_ref
fields:
  knowledge_base_id:
    type: string
  project_id:
    type: string
  repo_visible_state:
    enum: [bootstrap_pending, sealed, integrity_unknown, compromised]
  security_class:
    enum: [external_state_encrypted_master_private_integrity]
  plaintext_present:
    type: boolean
    must_be: false
  latest_public_root_ref:
    type: string
  latest_session_seal_ref:
    type: string
  public_summary:
    type: object
