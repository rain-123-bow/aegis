schema: knowledge_conflict_record.schema.yaml
version: v1
required:
  - conflict_id
  - involved_entry_ids
  - detected_at
  - detected_by
  - conflict_summary
  - status
fields:
  conflict_id:
    type: string
    pattern: '^C[0-9]{8}-[0-9]{3}-[a-z0-9-]+$'
  involved_entry_ids:
    type: list
    min_items: 2
  detected_at:
    type: datetime
  detected_by:
    type: string
  conflict_summary:
    type: string
  same_scope:
    type: boolean
  same_version_context:
    type: boolean
  status:
    enum: [open, resolved, evidence_required]
  resolution:
    type: object
    fields:
      resolved_at:
        type: datetime
      resolved_by:
        type: string
      action:
        enum: [scope_split, version_split, invalidate_one, supersede_one, keep_conflicted]
      rationale:
        type: string
