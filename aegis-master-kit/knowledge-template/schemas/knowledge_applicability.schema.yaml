schema: knowledge_applicability.schema.yaml
version: v1
required:
  - scope
  - version_context
  - conditions
fields:
  scope:
    type: object
    required: [project_scope]
    fields:
      project_scope:
        type: string
      module_scope:
        type: string
      environment_scope:
        type: string
      hardware_scope:
        type: string
      customer_scope:
        type: string
  version_context:
    type: object
    fields:
      commit:
        type: string
      branch:
        type: string
      release:
        type: string
      OS:
        type: string
      hardware_revision:
        type: string
      dependency_versions:
        type: map
  conditions:
    type: list
    description: Objective conditions under which the statement applies. Empty list means unconditional within scope/version_context.
    item_fields:
      variable:
        type: string
      operator:
        enum: ['==', '!=', '>', '>=', '<', '<=', 'in', 'not_in', 'exists', 'observed']
      value:
        type: any
      unit:
        type: string
      observability:
        enum: [direct_measurement, log, configuration, external_requirement, vendor_spec, code_inspection, other]
