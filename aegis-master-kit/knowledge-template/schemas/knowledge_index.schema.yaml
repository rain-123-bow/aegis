schema: knowledge_index.schema.yaml
version: v1
required:
  - index_name
  - generated_at
  - generated_from_payload_root
  - entries
fields:
  index_name:
    type: string
  generated_at:
    type: datetime
  generated_from_payload_root:
    type: string
  entries:
    type: map
    description: index key to list of Knowledge entry IDs
  sensitivity:
    enum: [public_safe, encrypted_only]
