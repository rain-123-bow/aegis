schema: knowledge_status_transition.schema.yaml
version: v1
required:
  - transition_id
  - entry_id
  - from_status
  - to_status
  - changed_at
  - changed_by
  - reason
  - evidence
fields:
  transition_id:
    type: string
  entry_id:
    type: string
  from_status:
    enum: [active, tentative, deprecated, invalidated, superseded, conflicted]
  to_status:
    enum: [active, tentative, deprecated, invalidated, superseded, conflicted]
  changed_at:
    type: datetime
  changed_by:
    type: string
  reason:
    type: string
  evidence:
    type: list
  superseded_by:
    type: list
  invalidation_reason:
    type: string
