schema: knowledge_source.schema.yaml
version: v1
required:
  - type
  - ref
  - collected_at
  - evidence_level
fields:
  type:
    enum:
      - developer_input
      - agent_observation
      - test_result
      - runtime_log
      - code_inspection
      - vendor_doc
      - customer_requirement
      - external_spec
      - project_document
      - other
  ref:
    type: string
  provided_by:
    type: string
  collected_by:
    type: string
  collected_at:
    type: datetime
  evidence_level:
    enum: [primary, secondary, reported, derived_summary]
  sensitive:
    type: boolean
  public_summary:
    type: string
