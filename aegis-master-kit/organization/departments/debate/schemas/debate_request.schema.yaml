schema_id: debate_request_v1
version: 1
purpose: Input shape for a Debate Department request.
required:
  - request_id
  - request_source
  - question
  - decision_needed
  - context
  - constraints
  - expected_output
fields:
  request_id:
    type: string
    description: Unique request identifier.
  request_source:
    type: enum
    allowed: [master, execution]
    description: Top-level sender that requested debate.
  question:
    type: string
    description: The question to debate.
  decision_needed:
    type: string
    description: The decision the requester needs after debate.
  context:
    type: object
    required: false
    description: Minimal background context needed to form stances.
  constraints:
    type: list[string]
    description: System, project, contract, safety, or resource constraints.
  known_options:
    type: list[string]
    required: false
    description: Optional candidate positions provided by requester.
  evidence:
    type: list[object]
    required: false
    item_fields:
      type: string
      ref: string
      summary: string
      relevance: string
  forbidden_moves:
    type: list[string]
    required: false
    description: Actions or assumptions forbidden in this debate.
  expected_output:
    type: enum
    allowed: [route_decision, causal_proposal, conflict_surface, evidence_gap_report]
  urgency:
    type: enum
    allowed: [low, normal, high]
    required: false
leader_admission_output:
  accepted:
    required_fields:
      - debate_run_id
      - stance_packets
      - reason_for_debate
  rejected:
    required_fields:
      - reason_code
      - why
      - suggested_next_route
