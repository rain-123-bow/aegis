schema_id: debate_leader_final_report_v1
version: 1
purpose: Final Debate Leader report returned to Master or Execution.
required:
  - debate_run_id
  - request_id
  - request_source
  - decision
  - reason_for_debate
  - stances_considered
  - adjudication_summary
  - causal_result
  - cleanup_result
fields:
  debate_run_id:
    type: string
  request_id:
    type: string
  request_source:
    type: enum
    allowed: [master, execution]
  decision:
    type: enum
    allowed: [accept_one, accept_multiple_by_scope, need_more_evidence, rejected_no_valid_position, rejected_no_debate_needed, stop_and_request_test, stop_and_escalate_to_master]
    description: Final adjudication decision. Do not use request_more_context here; that is admission-stage only. Do not use escalated here; that is handoff status, not final decision.
  reason_for_debate:
    type: string
  stances_considered:
    type: list[object]
    item_fields:
      stance_id: string
      claim: string
      final_status: accepted|rejected|scoped|conceded|deferred
      summary: string
  adjudication_summary:
    type: object
    required_fields:
      - why_selected
      - why_alternatives_failed
      - unresolved_questions
  causal_result:
    type: object
    required_fields:
      - statement
      - why
      - evidence
      - scope
      - assumptions
      - material_conditions
      - rejected_alternatives
      - risk_if_wrong
      - invalidation_conditions
      - next_action
      - confidence
      - status
  required_measurements:
    type: list[string]
    required: conditional
    required_when: decision == stop_and_request_test
    description: Concrete measurements, benchmarks, experiments, log captures, or validations needed from Test.
  test_request:
    type: object
    required: conditional
    required_when: decision == stop_and_request_test
    required_fields:
      - target
      - plan_ref
      - why_needed
  escalation:
    type: object
    required: conditional
    required_when: decision == stop_and_escalate_to_master
    required_fields:
      - target
      - issue
      - why_debate_cannot_decide
  escalation_status:
    type: enum
    allowed: [not_applicable, pending_handoff, handed_off]
    required: false
    description: Handoff state only. It must not replace decision == stop_and_escalate_to_master.
  cleanup_result:
    type: object
    required_fields:
      - workers_released
      - topology_released
      - retained_artifacts
  transcript_digest:
    type: list[object]
    required: false
    item_fields:
      round: integer
      summary: string
      why_it_matters: string
