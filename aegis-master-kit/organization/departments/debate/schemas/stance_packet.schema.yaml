schema_id: stance_packet_v1
version: 1
purpose: Stance assignment given by Debate Leader to a temporary Debate Worker.
required:
  - debate_run_id
  - stance_id
  - worker_id
  - claim
  - why_plausible
  - assumptions
  - scope
  - risk_if_wrong
  - attack_targets
fields:
  debate_run_id:
    type: string
  stance_id:
    type: string
  worker_id:
    type: string
  claim:
    type: string
    description: The stance the worker must defend.
  why_plausible:
    type: string
    description: Initial reason this stance may be valid.
  evidence:
    type: list[object]
    required: false
    item_fields:
      type: string
      ref: string
      summary: string
      relevance: string
  assumptions:
    type: list[string]
  material_conditions:
    type: list[string]
    description: Concrete conditions that support the stance.
  scope:
    type: string
  risk_if_wrong:
    type: string
  expected_action_impact:
    type: string
    required: false
  attack_targets:
    type: list[string]
    description: Other stance ids that this worker should pressure.
  concession_threshold:
    type: string
    required: false
    description: Concrete conditions under which the worker should concede.
forbidden:
  - unbound generic brainstorming
  - silent stance switching
  - invented evidence
  - final adjudication by worker
