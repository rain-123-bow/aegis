package: debate_department_role_skills
version: v0.1-phase25a
scope: aegis-master-kit/organization/departments/debate
contains_runtime_code: false
purpose: Define Debate Leader and Debate Worker role-bound operational skills.
files:
  - README.md
  - DEBATE_LEADER_OPERATIONAL_SKILL.md
  - DEBATE_WORKER_OPERATIONAL_SKILL.md
  - DEBATE_LEADER_WORKER_SKILL_ENFORCEMENT_CONTRACT.md
  - DEBATE_DEPARTMENT_CONTRACT.md
  - DEBATE_RUN_LIFECYCLE.md
  - INTERNAL_TOPOLOGY_CONTRACT.md
  - DEBATE_RESULT_MAILBUCKET_PACKAGE_CONTRACT.md
  - CAUSAL_STRUCTURE_RATIONALE.md
  - schemas/debate_request.schema.yaml
  - schemas/stance_packet.schema.yaml
  - schemas/worker_turn.schema.yaml
  - schemas/leader_final_report.schema.yaml
  - templates/debate_request.yaml
  - templates/stance_packet.yaml
  - templates/worker_prompt.md
  - templates/leader_final_report.md
  - tests/DEBATE_DEPARTMENT_CONSTRAINT_TESTS.md
removed_superseded_contracts:
  - DEBATE_LEADER_CONTRACT.md
  - DEBATE_WORKER_CONTRACT.md
  - DEBATE_WORKER_CAUSAL_STATE_CONTRACT.md
  - DEBATE_ADJUDICATOR_CAUSAL_STATE_CONTRACT.md
  - ADJUDICATION_AND_CAUSAL_OUTPUT_RULES.md
key_invariants:
  - Debate Leader is the only external department boundary.
  - Workers are one-run stance-bound temporary agents.
  - Debate requires at least two defensible independent stances.
  - Internal communication is leader-mediated round-robin broadcast.
  - Leader must install Debate Worker skill into every created Worker.
  - Worker output is invalid without DEBATE_WORKER_OPERATIONAL_SKILL skill_ref.
  - Worker-local causal state and Leader adjudicator causal state must be retained.
  - Final output must preserve causal structure, not only conclusions.
  - Causal equipoise requires developer decision instead of arbitrary selection.
  - Debate output is a causal candidate, not automatic global causal truth.
