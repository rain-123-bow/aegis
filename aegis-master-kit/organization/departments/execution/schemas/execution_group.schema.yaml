schema_id: execution_group_v1
required: [group_id, subtask_id, branch_name, front_agent_id, back_agent_id, lifecycle_status]
fields:
  group_id: string
  parent_task_id: string
  subtask_id: string
  responsibility_scope: string
  branch_name: string
  owned_files_or_modules: list[string]
  front_agent_id: string
  back_agent_id: string
  lifecycle_status: CREATED|PLANNING|IMPLEMENTING|MODULE_TESTING|INTERNAL_REVIEW|CHANGES_REQUESTED|READY_FOR_LEADER|INTEGRATED|UNDER_TEST|TEST_FAILED|REWORK_REQUIRED|REWORKING|REINTEGRATED|TEST_PASSED|ACCEPTED|RELEASED
  leader_decision: resolve_internal_review_dispute|request_failure_evidence|triage_required|map_to_group|map_to_integration_owner|rework_required|release_groups|submit_causal_fork_to_master
  test_feedback: list[object]
  causal_fork_ref: string
