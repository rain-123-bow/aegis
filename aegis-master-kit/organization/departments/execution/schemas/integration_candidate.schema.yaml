schema_id: implementation_candidate_v1
required: [task_id, integration_branch, merged_group_branches, changed_files, status]
fields:
  task_id: string
  source_request_id: string
  decision: send_implementation_candidate_to_test
  integration_branch: string
  base_branch: string
  merged_group_branches: list[object]
  changed_files: list[object]
  local_tests: list[object]
  back_reviews: list[object]
  integration_conflicts: list[object]
  known_limits: list[string]
  risk_if_wrong: string
  expected_test_focus: list[string]
  evidence_refs: list[string]
  feedback_mapping_table: list[object]
  status: implementation_candidate
