hard_rules:
  - Execution Leader is the only external department boundary.
  - Front and Back Agents are group-internal request-scoped agents.
  - Leader must install Front/Back skills into every created child Agent.
  - Every child Front/Back Agent requires child_agent_creation_proof.
  - Final Front/Back acceptance requires non-empty thread_id matching creation proof.
  - Each Execution Group has one independent workspace and one base-derived group branch.
  - Front works only inside group workspace and group work branch.
  - Back reviews the real group work branch diff and uses independent audit workspace by default.
  - Leader owns integration branch and Test handoff.
  - Execution output is a causal candidate, not automatic global causal truth.
phase26a_notes:
  - Phase 26A validates role-bound Execution Leader/Front/Back operational skill enforcement.
  - It does not claim production branch governance, remote push, PR, release, or global causal merge.
