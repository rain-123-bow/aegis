department_id: test
version: v0.2
scope: department_contract_and_role_skill_package
status: role_operational_skills_active_draft
external_role_id: test
external_boundary: Test Leader
runtime_package: aegis-runtime/test
skills:
  leader: TEST_LEADER_OPERATIONAL_SKILL.md
  worker: TEST_WORKER_OPERATIONAL_SKILL.md
skill_enforcement:
  leader_worker: TEST_LEADER_WORKER_SKILL_ENFORCEMENT_CONTRACT.md
contracts:
  department: TEST_DEPARTMENT_CONTRACT.md
  plan_route_split: TEST_PLAN_AND_ROUTE_SPLIT_CONTRACT.md
  evidence_retention: TEST_EVIDENCE_AND_RETENTION_CONTRACT.md
  result_handoff: TEST_RESULT_AND_HANDOFF_CONTRACT.md
  phase20a_handoff_validation: TEST_20A_HANDOFF_VALIDATION_CONTRACT.md
  real_test_workers: TEST_REAL_WORKER_CONTRACT.md
  phase20b_acceptance: TEST_20B_ACCEPTANCE_CONTRACT.md
superseded_role_contracts_removed:
  - TEST_LEADER_CONTRACT.md
  - TEST_WORKER_CONTRACT.md
schemas:
  - schemas/test_request.schema.yaml
  - schemas/test_plan.schema.yaml
  - schemas/test_route.schema.yaml
  - schemas/test_worker_report.schema.yaml
  - schemas/test_final_report.schema.yaml
templates:
  - templates/test_request.yaml
  - templates/test_plan.yaml
  - templates/worker_prompt.md
  - templates/test_final_report.md
tests:
  - tests/TEST_DEPARTMENT_CONSTRAINT_TESTS.md
hard_rules:
  - Do not treat Test as an Execution helper.
  - Do not modify implementation code inside Test.
  - Do not create Test Workers before the test plan and route split are justified.
  - Do not create Test Workers without installing TEST_WORKER_OPERATIONAL_SKILL.
  - Do not judge Worker lifecycle by outer MCP/tools timeout.
  - Use subagent thread_id as the Worker lifecycle identity key.
  - Treat launcher timeout as launcher_timeout, not worker_failed, when thread_id exists.
  - Do not create duplicate Workers for the same route solely because launcher timeout occurred.
  - Final Worker proof and output must include matching non-empty thread_id.
  - Do not let a Worker decide the whole candidate result.
  - Do not send passed results directly to Master under the current topology.
  - Do not assign rework directly to Execution Groups; send evidence to Execution Leader.
  - Do not claim global causal truth from Test results.
  - Do not discard the minimal reproducibility set.
  - Do not downgrade proven candidate failure to inconclusive merely because owner responsibility is ambiguous.
  - Do not report failed when evidence is missing, unstable, contradictory, or not reproducible enough.
  - Do not report passed_with_scope_limit if any mandatory route failed, was blocked, or was inconclusive.
  - Do not ask Execution to patch around governance or policy blockers.
  - Report governance or policy blockers as blocked with blocker_kind governance.
  - Do not route Test output directly to Master under the current topology.

phase20a_notes:
  - Phase 20A validates Test Leader consumption of Execution Phase 19B handoff packages.
  - Phase 20A runs real local tests against the sandbox integration branch.
  - Phase 20A does not claim real Test Worker Codex agent closure or production CI closure.

phase20b_notes:
  - Phase 20B validates real nested-Codex Test Worker acceptance.
  - Phase 20B reuses Phase 20A handoff validation and sandbox integration-branch boundaries.
  - Phase 20B does not claim production CI, remote branch governance, PR, release, or global causal merge.

phase27a_notes:
  - Phase 27A replaces Test Leader / Worker role contracts with role-bound operational skills.
  - Phase 27A preserves Test top-level routes execution -> test, test -> execution, and test -> final_review.
  - Phase 27A requires Test Worker lifecycle supervision by subagent thread_id.
  - Phase 27A is a document/package hardening step and does not claim production Test lifecycle closure.
