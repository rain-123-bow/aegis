schema_id: test_route_v1
required:
  - route_id
  - route_type
  - scope
  - method
  - pass_fail_rules
  - evidence_requirements
  - independence_reason
fields:
  route_id: string
  route_type: contract|unit|integration|regression|security|performance|reproducibility|manual_inspection|other
  mandatory: boolean
  scope: list[string]
  method: command|inspection|hybrid
  commands: list[string]
  inspection_steps: list[string]
  environment_requirements: list[string]
  pass_fail_rules: list[string]
  evidence_requirements: list[string]
  artifacts_expected: list[string]
  independence_reason: string
  shared_state: list[string]
  isolation_rule: string
  order_dependency: none|before:<route_id>|after:<route_id>
  worker_assignment: string
