department_id: final_review
version: v0.2
scope: department_contract_and_role_skill_package
status: role_operational_skill_active_draft
external_role_id: final_review
external_boundary: Final Review Leader
runtime_package: aegis-runtime/final_review
contains_runtime_code: false
model_policy_file_created_by_this_package: false
skills:
  leader: FINAL_REVIEW_LEADER_OPERATIONAL_SKILL.md
contracts:
  department: FINAL_REVIEW_DEPARTMENT_CONTRACT.md
  input_package: FINAL_REVIEW_INPUT_PACKAGE_CONTRACT.md
  whole_chain_consistency: WHOLE_CHAIN_CONSISTENCY_REVIEW_CONTRACT.md
  result_handoff: FINAL_REVIEW_RESULT_AND_HANDOFF_CONTRACT.md
  resource_policy_reference: RESOURCE_POLICY_REFERENCE_CONTRACT.md
  phase21a_handoff_validation: FINAL_REVIEW_21A_HANDOFF_VALIDATION_CONTRACT.md
  phase21b_real_leader_acceptance: FINAL_REVIEW_21B_REAL_LEADER_ACCEPTANCE_CONTRACT.md
superseded_role_contracts_removed:
  - FINAL_REVIEW_LEADER_CONTRACT.md
schemas:
  - schemas/final_review_request.schema.yaml
  - schemas/final_review_input_package.schema.yaml
  - schemas/final_review_result.schema.yaml
templates:
  - templates/final_review_request.yaml
  - templates/final_review_result.md
tests:
  - tests/FINAL_REVIEW_DEPARTMENT_CONSTRAINT_TESTS.md
hard_rules:
  - Use exactly one Final Review Leader.
  - Do not create internal Final Review Workers.
  - Do not parallelize final review across agents.
  - Do not modify implementation code.
  - Do not run or replace Test routes.
  - Do not assign Execution Group rework.
  - Do not send Final Review output directly to Execution or Test.
  - Return only to Master under the current topology.
  - Do not merge global causal truth.
  - Do not hide uncovered scope or known limits.
  - Do not accept when final_code_ref, implementation_candidate_ref, and tested_candidate_ref are inconsistent.
  - Do not accept when required evidence is missing, stale, contradictory, or not reproducible.
  - Resolve model and reasoning budget from MODEL_REASONING_BUDGET_POLICY.yaml.
  - Use requested_reasoning_budget and resolved_reasoning_budget for policy-facing resource audit records.
  - If required review resource policy cannot be satisfied, return blocked_resource_policy.
  - Do not continue whole-chain review when final_review_leader resource policy is missing, unavailable, insufficient, or fallback is forbidden.
  - For blocked_resource_policy, mark whole_chain_review.status as not_started and graph_built as false.
  - For non-resource-blocked decisions, require whole_chain_review.status completed and graph_built true.
  - Debate applicability must be explicit through debate_applicability used|not_used.
  - Empty debate_refs alone is not enough to prove Debate was not used.
  - Do not return accept_for_master with non-empty known_limits, blocked_scope, missing_evidence, or governance_blockers.
  - Do not confuse material_conditions with limiting known_limits.
  - Resource policy failure has highest precedence and must return blocked_resource_policy.
  - final_review_result must include status final_review_recommendation.
  - Normative final_review_result examples must include all required fields.
  - External boundary is Final Review Leader; route edges are allowed communication paths.
  - Do not claim production Final Review runtime closure.

phase21a_notes:
  - Phase 21A validates Final Review handoff consumption after Test Phase 20B.
  - Phase 21A does not create a real nested-Codex Final Review Leader.
  - Phase 21A does not create Final Review Workers.

phase21b_notes:
  - Phase 21B validates real nested-Codex / Codex Final Review Leader acceptance.
  - Phase 21B preserves the single-Leader Final Review architecture.
  - Phase 21B does not create Final Review Workers.
  - Phase 21B does not claim production Final Review lifecycle closure.

phase29a_notes:
  - Phase 29A replaces the Final Review Leader role contract with FINAL_REVIEW_LEADER_OPERATIONAL_SKILL.md.
  - Phase 29A preserves the single-Leader, no-worker Final Review architecture.
  - Phase 29A synchronizes Final Review input/result schemas and the result template with the new role skill.
  - Phase 29A adds resource policy resolution, debate applicability, auditable whole_chain_review, and status final_review_recommendation requirements to the role-skill boundary.
  - Phase 29A is a document/package hardening step and does not claim production Final Review lifecycle closure or runtime validator closure.
