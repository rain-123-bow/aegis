schema_id: final_review_request_v1
required:
  - request_id
  - source
  - final_review_input_package
fields:
  request_id: string
  source: test
  final_review_input_package: object
  resource_policy_ref: string
invalid_if:
  - source != test
  - final_review_input_package is empty
  - direct_route_to_execution_requested
  - direct_route_to_test_requested
