schema_id: final_review_result_v2
required:
  - final_review_result_id
  - request_id
  - status
  - decision
  - target
  - why
  - final_code_ref
  - implementation_candidate_ref
  - tested_candidate_ref
  - reviewed_refs
  - debate_applicability
  - whole_chain_review
  - accepted_scope
  - blocked_scope
  - known_limits
  - missing_evidence
  - governance_blockers
  - material_conditions
  - assumptions
  - resource_policy
  - causal_boundary
  - recommended_master_action
fields:
  final_review_result_id: string
  request_id: string
  status: final_review_recommendation
  decision: accept_for_master|accept_for_master_with_scope_limit|reject_to_execution_via_master|request_test_expansion_via_master|request_more_evidence_via_master|governance_blocker_to_master|blocked_resource_policy
  target: master
  why: string
  final_code_ref: string
  implementation_candidate_ref: string
  tested_candidate_ref: string
  reviewed_refs: object
  debate_applicability: used|not_used
  no_debate_used_reason: string|null
  whole_chain_review:
    status: completed|not_started
    graph_built: true|false
    not_started_reason: string|null
    reviewed_edges: list[object]
    consistency_findings: list[string]
  accepted_scope: list[string]
  blocked_scope: list[string]
  known_limits: list[string]
  missing_evidence: list[string]
  governance_blockers: list[string]
  material_conditions: list[string]
  assumptions: list[string]
  resource_policy:
    policy_ref: string
    required_profile: final_review_leader
    requested_model: string
    resolved_model: string
    requested_reasoning_budget: extra_high
    resolved_reasoning_budget: extra_high
    fallback_used: false
    fallback_reason: string|null
    fallback_evidence_refs: list[string]
    dynamic_adjustment_used: false
    status: satisfied|missing|unavailable|insufficient|fallback_forbidden
  causal_boundary: string
  recommended_master_action: string
  remote_push_performed: false
  pull_request_created: false
  remote_merge_performed: false
  release_performed: false
  deployment_performed: false
  external_signoff_performed: false
  production_store_write_performed: false
  global_causal_truth_merge_performed: false
invalid_if:
  - status != final_review_recommendation
  - target != master
  - decision == accept_for_master and known_limits is not empty
  - decision == accept_for_master and blocked_scope is not empty
  - decision == accept_for_master and missing_evidence is not empty
  - decision == accept_for_master and governance_blockers is not empty
  - decision == accept_for_master and resource_policy.status != satisfied
  - decision == accept_for_master and final_code_ref materially differs from tested_candidate_ref
  - decision == accept_for_master_with_scope_limit and known_limits is empty and blocked_scope is empty
  - decision == accept_for_master_with_scope_limit and resource_policy.status != satisfied
  - decision != blocked_resource_policy and resource_policy.status != satisfied
  - decision == blocked_resource_policy and resource_policy.status == satisfied
  - decision == blocked_resource_policy and whole_chain_review.status != not_started
  - decision == blocked_resource_policy and whole_chain_review.graph_built != false
  - decision == blocked_resource_policy and whole_chain_review.not_started_reason != blocked_resource_policy
  - decision != blocked_resource_policy and whole_chain_review.status != completed
  - decision != blocked_resource_policy and whole_chain_review.graph_built != true
  - debate_applicability == used and reviewed_refs.debate_refs is empty
  - debate_applicability == not_used and no_debate_used_reason is empty
  - resource_policy.requested_reasoning_budget != extra_high
  - resource_policy.resolved_reasoning_budget != extra_high
  - resource_policy.dynamic_adjustment_used != false
  - direct_execution_or_test_route_present
  - claims_global_causal_truth
notes:
  - Resource policy failure has highest decision precedence.
  - known_limits are limiting acceptance constraints.
  - material_conditions are contextual applicability conditions and are not a substitute for known_limits.
  - accept_for_master requires no limiting known_limits.
  - normative examples must include all required fields or be explicitly labeled non-normative fragments.
