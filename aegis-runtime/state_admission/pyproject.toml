[project]
name = "aegis-state-admission-runtime"
version = "0.1.0"
description = "Phase 22A Master-owned Archive/Knowledge/Causal admission validator for Aegis."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Project"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aegis-state-admission = "aegis_state_admission.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: runtime contract verification tests for Phase 22A three-store admission",
]
