[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-causal-review-runtime"
version = "0.1.0"
description = "Aegis Phase 22B Master causal review deterministic runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aegis-causal-review = "aegis_causal_review.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
