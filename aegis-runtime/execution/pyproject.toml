[project]
name = "aegis-execution-runtime"
version = "0.1.0"
description = "Demo runtime for the Aegis Execution Department contract."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Project"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aegis-execution-demo = "aegis_execution_runtime.cli:main"
aegis-execution-git-topology = "aegis_execution_runtime.git_topology_cli:main"
aegis-execution-real-agents = "aegis_execution_runtime.real_agent_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: runtime contract verification tests for Execution Department demo behavior",
    "router: router-integrated Execution closure tests",
]
