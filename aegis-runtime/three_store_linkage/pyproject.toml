[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-three-store-linkage"
version = "0.1.0"
description = "Aegis Phase 23C local demo three-store linkage validator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_three_store_linkage*"]
