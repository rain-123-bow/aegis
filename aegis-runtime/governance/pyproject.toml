[project]
name = "aegis-governance-runtime"
version = "0.1.0"
description = "Runtime hard-gate kernel for Aegis governance, capability, state-machine, and artifact contracts."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Project"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: runtime contract verification tests for Aegis governance hard gates",
]
