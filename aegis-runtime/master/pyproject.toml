[project]
name = "aegis-master-runtime"
version = "0.1.0"
description = "Demo runtime for Aegis Master top-level nested-Codex leader creation."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Project"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aegis-master-demo = "aegis_master_runtime.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: runtime contract verification tests for Master top-level demo behavior",
    "router: router-integrated top-level Master closure tests",
    "real_mcp: tests requiring a real nested-codex MCP server",
]
