[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-archive-store"
version = "0.1.0"
description = "Aegis Phase 23A local demo Archive segmented persistence runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_archive_store*"]
