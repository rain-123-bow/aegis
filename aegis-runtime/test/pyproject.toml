[project]
name = "aegis-test-runtime"
version = "0.1.0"
description = "Demo runtime for the Aegis Test Department contract."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Aegis Project"}]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
aegis-test-demo = "aegis_test_runtime.cli:main"
aegis-test-handoff-validation = "aegis_test_runtime.handoff_validation_cli:main"
aegis-test-real-workers = "aegis_test_runtime.real_worker_cli:main"
aegis-test-operational-skill = "aegis_test_runtime.operational_skill:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "contract: runtime contract verification tests for Test Department demo behavior",
    "router: router-integrated Test closure tests",
]
