policy_id: model_reasoning_budget_policy
version: v0.2
scope: whole_aegis_runtime
status: locked_static_policy_with_explicit_gpt54_fallback

purpose: >
  Define the authoritative AI model and reasoning-budget allocation for
  Master and top-level department leaders in the current Aegis phase.

phase_boundary:
  current_phase: phase_2_master_operational_skill_hardening
  dynamic_adjustment_enabled: false
  master_dynamic_adjustment_deferred: true
  module_internal_agent_profiles_deferred: false

hard_rules:
  - Model and reasoning-budget selection is owned by this root policy.
  - Agents must not self-select models or reasoning budgets.
  - Silent downgrade is forbidden.
  - Provider-default model fallback is forbidden.
  - Missing or unsatisfied policy must fail fast instead of silently continuing.
  - Runtime outputs that depend on model execution must record the resolved profile.
  - Primary model is gpt-5.5.
  - If gpt-5.5 is objectively unavailable, explicit fallback to gpt-5.4 is allowed with evidence.
  - Models below gpt-5.4 are forbidden.
  - Reasoning budget downgrade is forbidden even when model fallback is used.

fallback_policy:
  default_fallback_allowed: false
  silent_downgrade_allowed: false
  explicit_gpt55_to_gpt54_fallback_allowed: true
  minimum_accepted_model: gpt-5.4
  fallback_on_missing_model: explicit_gpt54_only_with_evidence
  fallback_on_budget_unavailable: forbidden
  reasoning_budget_downgrade_allowed: false
  missing_policy_behavior: blocked_resource_policy
  authority: root_policy_only

fallback_interpretation:
  role_profile_fallback_allowed_false_means: >
    The role may not self-authorize fallback and may not silently accept a
    provider-default model. It does not override the root explicit fallback
    policy.
  only_valid_runtime_fallback: >
    The root policy may authorize gpt-5.5 -> gpt-5.4 only when gpt-5.5 is
    objectively unavailable, explicit evidence is recorded, and the configured
    reasoning_budget is preserved.
  unresolved_tool_attestation_behavior: >
    If the execution tool cannot independently attest the actual resolved model
    and reasoning budget, the audit record must say requested_policy_only or
    unattested. It must not claim independently verified model execution.
  behavioral_attestation_behavior: >
    Master may challenge a created agent with a standard deep-reasoning task
    and score the answer against a fixed rubric. Passing this gate may produce
    behaviorally_attested status. It is stronger than requested_policy_only but
    remains distinct from tool_attested because it infers capability from
    behavior rather than reading authoritative tool metadata.

profile_schema:
  fields:
    role_id: string
    model: string
    reasoning_budget: low|medium|medium_high|high|extra_high
    fallback_allowed: boolean
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: boolean
    notes: string

profiles:
  master:
    role_id: master
    model: gpt-5.5
    reasoning_budget: extra_high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Master owns top-level governance, request admission, route-level authority,
      and final causal merge decisions. It uses the highest configured budget in
      this phase.

  debate_leader:
    role_id: debate_leader
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Debate Leader owns adversarial reasoning orchestration and adjudication.
      Worker-level debate profiles are intentionally deferred.


  debate_worker:
    role_id: debate_worker
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Debate Workers are request-scoped, stance-bound internal agents created by
      the Debate Leader. Each Debate Worker owns the complete personal work for
      its assigned stance: information collection within allowed evidence
      boundaries, stance defense, attacks on competing stances, answers,
      scope narrowing, causal-state maintenance, and explicit concession when
      defeated. Medium reasoning budget is forbidden for Debate Workers in the
      current phase.

  execution_leader:
    role_id: execution_leader
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Execution Leader owns planning, task split, group supervision,
      integration, test feedback routing, and execution causal reporting.
      Execution Front and Back agent profiles are explicitly defined starting
      in Phase 19B.

  execution_front_agent:
    role_id: execution_front_agent
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Execution Front Agents are request-scoped group-internal agents created
      by the Execution Leader. A Front Agent implements its assigned group task,
      runs local validation when available, preserves touched files and evidence,
      and emits a group causal fork. Medium reasoning budget is forbidden for
      Execution Front Agents in the current phase.

  execution_back_agent:
    role_id: execution_back_agent
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Execution Back Agents are request-scoped group-internal agents created
      by the Execution Leader. A Back Agent independently reviews Front output,
      local tests, diffs, contract compliance, and first-principles suitability.
      Back Agents have blocking review authority. Medium reasoning budget is
      forbidden for Execution Back Agents in the current phase.

  test_leader:
    role_id: test_leader
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Test Leader owns test plan design, route split, evidence aggregation,
      failure feedback, and final test result handoff. Test Worker profiles are
      explicitly defined starting in Phase 20B.

  test_worker:
    role_id: test_worker
    model: gpt-5.5
    reasoning_budget: high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    notes: >
      Test Workers are request-scoped, route-bound internal agents created by
      the Test Leader. Each Test Worker runs or verifies its assigned validation
      route, preserves command evidence and artifacts, and emits a scoped test
      worker report. Medium reasoning budget is forbidden for Test Workers in
      the current phase.

  final_review_leader:
    role_id: final_review_leader
    model: gpt-5.5
    reasoning_budget: extra_high
    fallback_allowed: false
    fallback_authority: root_policy_only
    dynamic_adjustment_allowed: false
    parallel_internal_workers: forbidden
    notes: >
      Final Review Leader owns single-subject whole-chain review before results
      return to Master. It must use the highest configured budget in this phase
      and must not compensate for resource shortage by creating parallel workers.

deferred_profiles: []

audit_requirements:
  required_fields:
    - policy_id
    - policy_version
    - role_id
    - requested_model
    - resolved_model
    - requested_reasoning_budget
    - resolved_reasoning_budget
    - model_attestation_status
    - fallback_used
    - fallback_reason
    - fallback_evidence_refs
    - dynamic_adjustment_used
    - behavioral_attestation_status
    - behavioral_attestation_ref
  fallback_used_requires_explicit_evidence: true
  dynamic_adjustment_used_must_be_false_in_current_phase: true
  reasoning_budget_downgrade_allowed: false
  minimum_accepted_model: gpt-5.4
  accepted_model_attestation_statuses:
    - tool_attested
    - behaviorally_attested
    - requested_policy_only
    - unattested
  behaviorally_attested_is_not_tool_attested: true


phase24a_fallback_note: >
  Role model profiles keep gpt-5.5 as the primary model. If gpt-5.5 is objectively unavailable,
  gpt-5.4 may be used only with explicit evidence and with the configured reasoning_budget preserved.
  Models below gpt-5.4 and reasoning-budget downgrades remain forbidden.
